<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かんたん家計簿</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:600px;margin:auto;padding:20px;background:#f6f7fb;color:#182235}h1{font-size:24px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd1da;box-sizing:border-box}input,select{width:100%;margin:6px 0 12px}button{background:#2563eb;color:white;border:0;cursor:pointer}.danger{background:#e9edf3;color:#334155}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0}.row button{padding:7px 10px}.total{font-size:32px;font-weight:700}small{color:#64748b}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar span{display:block;background:#2563eb;height:100%}</style></head><body><h1>💰 かんたん家計簿</h1><div class="card"><small>支出合計</small><div class="total" id="total">0円</div><small id="count"></small></div><div class="card"><h2>支出を追加</h2><form id="form"><label>金額（円）<input id="amount" type="number" min="1" step="1" required placeholder="500"></label><label>費目<select id="category"><option>食費</option><option>飲料</option><option>日用品</option><option>交通</option><option>娯楽</option><option>その他</option></select></label><label>メモ<input id="memo" maxlength="100" placeholder="例：昼食"></label><button type="submit">＋ 支出を追加</button></form></div><div class="card"><h2>費目別</h2><div id="breakdown"></div></div><div class="card"><h2>履歴</h2><div id="history"></div><p><button class="danger" id="clear">すべて削除</button></p></div><small>このアプリはブラウザのlocalStorageにデータを保存します。同じブラウザ・同じURLで開いた場合に保持されます。プライベートブラウズやデータ消去などでは失われる場合があります。</small><script>const KEY='kakeibo-demo-v1';let entries=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))entries=saved}catch(e){}const yen=n=>n.toLocaleString('ja-JP')+'円';const categories=['食費','飲料','日用品','交通','娯楽','その他'];function save(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){alert('保存できませんでした。ブラウザの保存設定をご確認ください。')}render()}function render(){const total=entries.reduce((s,x)=>s+x.amount,0);document.getElementById('total').textContent=yen(total);document.getElementById('count').textContent=entries.length+'件の記録';const breakdown=document.getElementById('breakdown');breakdown.replaceChildren();categories.forEach(c=>{const n=entries.filter(x=>x.category===c).reduce((s,x)=>s+x.amount,0);if(!n)return;const wrap=document.createElement('div');wrap.style.marginBottom='14px';const label=document.createElement('div');label.className='row';label.textContent=c+'　'+yen(n);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('span');fill.style.width=(total?n/total*100:0)+'%';bar.append(fill);wrap.append(label,bar);breakdown.append(wrap)});const history=document.getElementById('history');history.replaceChildren();entries.forEach(x=>{const row=document.createElement('div');row.className='row';const text=document.createElement('div');const name=document.createElement('strong');name.textContent=x.memo||x.category;const meta=document.createElement('small');meta.textContent=' / '+x.category+' / '+yen(x.amount);text.append(name,meta);const del=document.createElement('button');del.className='danger';del.textContent='削除';del.addEventListener('click',()=>{entries=entries.filter(e=>e.id!==x.id);save()});row.append(text,del);history.append(row)})}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const amount=Number(document.getElementById('amount').value);if(!Number.isSafeInteger(amount)||amount<=0)return;entries.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),amount,category:document.getElementById('category').value,memo:document.getElementById('memo').value.trim()});document.getElementById('amount').value='';document.getElementById('memo').value='';save()});document.getElementById('clear').addEventListener('click',()=>{if(confirm('全記録を削除しますか？')){entries=[];save()}});render();</script></body></html>
