<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>かんたん家計簿 v0.2</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--fg:#182235;--card:#fff;--muted:#64748b;--line:#d9dfe8;--button:#2563eb;--soft:#e9edf3;--shadow:#00000010}html[data-theme=dark]{color-scheme:dark;--bg:#101827;--fg:#edf2fc;--card:#1c293b;--muted:#a7b5ca;--line:#43516a;--button:#4787ff;--soft:#344257;--shadow:#0004}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;max-width:650px;margin:auto;padding:18px 16px 45px;background:var(--bg);color:var(--fg)}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 14px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{background:var(--card);border-radius:17px;padding:18px;margin:15px 0;box-shadow:0 2px 12px var(--shadow)}label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px;color:var(--fg)}input,select{width:100%;background:var(--card)}button{background:var(--button);color:#fff;border:0;cursor:pointer}button.secondary{background:var(--soft);color:var(--fg)}button:disabled{opacity:.5}.smallbtn{padding:7px 10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.total{font-size:32px;font-weight:750}.muted,small{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.row>div{min-width:0;overflow-wrap:anywhere}.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0 13px}.bar span{display:block;background:var(--button);height:100%}.monthline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;width:min(94vw,500px);max-height:85vh;overflow:auto;padding:20px}dialog::backdrop{background:#0009}.notice{font-size:13px;color:var(--muted)}#status{min-height:1.4em}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7db5ff;outline-offset:2px}
</style></head><body>
<div class="head"><h1>💰 かんたん家計簿</h1><button id="theme" class="secondary smallbtn" type="button">🌙 ダーク</button></div><p class="muted">ChatGPT製 Webアプリ v0.2</p>
<section class="card"><small>支出合計（全期間）</small><div class="total" id="total">0円</div><small id="count">0件</small></section>
<section class="card"><h2>支出を追加</h2><form id="form"><label for="date">支出日</label><input id="date" type="date" required><label for="amount">金額（円）</label><input id="amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="500"><label for="category">費目</label><select id="category"><option>食費</option><option>飲料</option><option>日用品</option><option>交通</option><option>娯楽</option><option>その他</option></select><label for="memo">メモ</label><input id="memo" maxlength="100" placeholder="例：昼食"><div class="actions"><button type="submit">＋ 支出を追加</button></div></form><p id="status" class="notice" role="status"></p></section>
<section class="card"><h2>月別集計</h2><div id="months"></div></section>
<section class="card"><h2>費目別（全期間）</h2><div id="breakdown"></div></section>
<section class="card"><div class="head"><h2>履歴</h2><button id="csv" class="secondary smallbtn" type="button">CSV出力 ↓</button></div><label for="filter">表示する月</label><select id="filter"><option value="all">すべて</option></select><div id="history"></div><div class="actions"><button class="secondary smallbtn" id="clear" type="button">すべて削除</button></div></section>
<p class="notice">データはこのブラウザのlocalStorageに保存されます。以前の記録はそのまま引き継ぎ、日付のなかった記録は「日付未設定」で表示します。端末間同期はありません。ブラウザデータの消去等で失われる場合があるため、CSV出力でバックアップしてください。</p>
<dialog id="editor"><h2>履歴を編集</h2><form id="editForm"><label for="editDate">支出日（過去の記録は空欄可）</label><input id="editDate" type="date"><label for="editAmount">金額（円）</label><input id="editAmount" type="number" min="1" step="1" required><label for="editCategory">費目</label><select id="editCategory"><option>食費</option><option>飲料</option><option>日用品</option><option>交通</option><option>娯楽</option><option>その他</option></select><label for="editMemo">メモ</label><input id="editMemo" maxlength="100"><div class="actions"><button type="submit">変更を保存</button><button type="button" id="cancel" class="secondary">キャンセル</button></div></form></dialog>
<script>
(()=>{'use strict';
const KEY='kakeibo-demo-v1'; // v0.1 と同じ保存キー。旧データを上書き移行しない。
const THEME_KEY='kakeibo-theme-v2';const cats=['食費','飲料','日用品','交通','娯楽','その他'];const $=id=>document.getElementById(id);const yen=n=>n.toLocaleString('ja-JP')+'円';const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(new Date(s+'T00:00:00').getTime())&&new Date(s+'T00:00:00').getFullYear()===Number(s.slice(0,4))&&new Date(s+'T00:00:00').getMonth()+1===Number(s.slice(5,7))&&new Date(s+'T00:00:00').getDate()===Number(s.slice(8,10));
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('date').value=today();
let entries=[];let editingId=null;let loadFailed=false;
try{const raw=localStorage.getItem(KEY);if(raw!==null){const value=JSON.parse(raw);if(!Array.isArray(value))throw Error('unexpected storage');entries=value;}}catch(e){loadFailed=true;$('status').textContent='既存データを読み込めませんでした。安全のため編集・保存を停止しています。'}
const id=()=>typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);
// 古い記録の date は欠損のまま保持する。保存時も元データと同じ配列を使う。
const monthOf=x=>validDate(x.date)?x.date.slice(0,7):'undated';
function persist(){if(loadFailed)return false;try{localStorage.setItem(KEY,JSON.stringify(entries));$('status').textContent='保存しました';return true}catch(e){$('status').textContent='保存に失敗しました。CSVでバックアップしてください。';return false}}
function change(mutator){if(loadFailed)return;const previous=JSON.stringify(entries);mutator();if(!persist()){entries=JSON.parse(previous)}render()}
function render(){const total=entries.reduce((s,x)=>s+(Number.isFinite(Number(x.amount))?Number(x.amount):0),0);$('total').textContent=yen(total);$('count').textContent=entries.length+'件の記録';
const counts=new Map();entries.forEach(x=>{const m=monthOf(x);counts.set(m,(counts.get(m)||0)+Number(x.amount||0))});const months=[...counts.keys()].sort((a,b)=>a==='undated'?1:b==='undated'?-1:b.localeCompare(a));$('months').replaceChildren();if(!months.length)$('months').textContent='まだ記録がありません';months.forEach(m=>{const line=document.createElement('div');line.className='monthline';const a=document.createElement('span');a.textContent=m==='undated'?'日付未設定':m.replace('-','年')+'月';const b=document.createElement('strong');b.textContent=yen(counts.get(m));line.append(a,b);$('months').append(line)});
$('breakdown').replaceChildren();cats.forEach(c=>{const n=entries.filter(x=>x.category===c).reduce((s,x)=>s+Number(x.amount||0),0);if(!n)return;const name=document.createElement('div');name.textContent=c+'　'+yen(n);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('span');fill.style.width=(total?Math.max(0,Math.min(100,n/total*100)):0)+'%';bar.append(fill);$('breakdown').append(name,bar)});
const selected=$('filter').value;$('filter').replaceChildren();[['all','すべて'],...months.map(m=>[m,m==='undated'?'日付未設定':m.replace('-','年')+'月'])].forEach(([v,t])=>{const opt=document.createElement('option');opt.value=v;opt.textContent=t;$('filter').append(opt)});$('filter').value=[...$('filter').options].some(o=>o.value===selected)?selected:'all';
$('history').replaceChildren();const filtered=entries.filter(x=>$('filter').value==='all'||monthOf(x)===$('filter').value);if(!filtered.length)$('history').textContent='該当する履歴はありません';filtered.forEach(x=>{const row=document.createElement('div');row.className='row';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=x.memo||x.category||'支出';const meta=document.createElement('div');const small=document.createElement('small');small.textContent=(validDate(x.date)?x.date:'日付未設定')+' / '+(x.category||'未分類')+' / '+yen(Number(x.amount||0));meta.append(small);info.append(title,meta);const buttons=document.createElement('div');buttons.className='actions';const edit=document.createElement('button');edit.className='secondary smallbtn';edit.textContent='編集';edit.addEventListener('click',()=>openEdit(x));const del=document.createElement('button');del.className='secondary smallbtn';del.textContent='削除';del.addEventListener('click',()=>{if(confirm('この記録を削除しますか？'))change(()=>{entries=entries.filter(e=>e!==x)})});buttons.append(edit,del);row.append(info,buttons);$('history').append(row)})}
function openEdit(x){if(loadFailed)return;editingId=x;$('editDate').value=validDate(x.date)?x.date:'';$('editAmount').value=x.amount;$('editCategory').value=cats.includes(x.category)?x.category:cats[0];$('editMemo').value=x.memo||'';$('editor').showModal()}
$('editForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('editAmount').value),date=$('editDate').value;if(!Number.isSafeInteger(amount)||amount<1||amount>1000000000||date&&!validDate(date))return;const target=editingId;change(()=>{if(!entries.includes(target))return;target.amount=amount;target.category=$('editCategory').value;target.memo=$('editMemo').value.trim();if(date)target.date=date;else delete target.date});$('editor').close()});$('cancel').addEventListener('click',()=>$('editor').close());
$('form').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value),date=$('date').value;if(!Number.isSafeInteger(amount)||amount<1||amount>1000000000||!validDate(date)){$('status').textContent='金額と日付を確認してください';return}change(()=>entries.unshift({id:id(),amount,category:$('category').value,memo:$('memo').value.trim(),date}));$('amount').value='';$('memo').value=''});
$('filter').addEventListener('change',render);$('clear').addEventListener('click',()=>{if(confirm('すべての記録を削除しますか？この操作は元に戻せません。'))change(()=>{entries=[]})});
$('csv').addEventListener('click',()=>{const escapeCsv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['日付','金額','費目','メモ','ID'],...entries.map(x=>[validDate(x.date)?x.date:'',x.amount,x.category,x.memo,x.id])];const csv='\ufeff'+rows.map(r=>r.map(escapeCsv).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='kakeibo-backup-'+today()+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)});
function applyTheme(theme){document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'☀️ ライト':'🌙 ダーク';document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#101827':'#f6f7fb'}let theme='light';try{theme=localStorage.getItem(THEME_KEY)==='dark'?'dark':'light'}catch(e){}applyTheme(theme);$('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme(theme);try{localStorage.setItem(THEME_KEY,theme)}catch(e){}});
if(loadFailed){$('form').querySelector('button').disabled=true;$('clear').disabled=true}render();
})();
</script></body></html>
